<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Week 4 Assignment</title>
</head>

<body>

    <h2>Task 4.1 & 4.2: Registration & Details Form</h2>

    <form action="#" method="POST">
        <div>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <br>

        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <br>

        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>
        <br>

        <div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <br>

        <div>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <br>

        <div>
            <label>Interests:</label>
            <input type="checkbox" id="coding" name="interests" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="design" name="interests" value="design">
            <label for="design">Design</label>
        </div>
        <br>

        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
        </div>
        <br>

        <div>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="30"></textarea>
        </div>
        <br>

        <div>
            <button type="submit">Submit Form</button>
        </div>
    </form>

    <hr>

    <!-- Task 4.3: Events Table with thead, tbody, and tfoot -->
    <h2>Task 4.3: Events Schedule Table</h2>
    <table border="1">
        <!-- Heading Row -->
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Location</th>
            </tr>
        </thead>
        <!-- Body Rows -->
        <tbody>
            <tr>
                <td>Web Dev Bootcamp</td>
                <td>2026-11-05</td>
                <td>Online / Zoom</td>
            </tr>
            <tr>
                <td>Hackathon 2026</td>
                <td>2026-11-12</td>
                <td>Main Hall</td>
            </tr>
            <tr>
                <td>JavaScript Workshop</td>
                <td>2026-11-20</td>
                <td>Lab 3</td>
            </tr>
        </tbody>
        <!-- Footer Row -->
        <tfoot>
            <tr>
                <td colspan="3">Total Events: 3</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
